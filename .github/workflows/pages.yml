name: Build Cydia Repository

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Install dpkg-sig / utilities
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 zstd

      - name: Generate Packages and Metadata
        run: |
          dpkg-scanpackages -m ./debs > ./Packages
          bzip2 -k -f ./Packages
          gzip -k -f ./Packages
          zstd -k -f ./Packages -o ./Packages.zst

      - name: Commit and Push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add Packages Packages.bz2 Packages.gz Packages.zst || true
          git commit -m "Auto-update repository packages index" || true
          git push
