name: Update Cydia Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup dpkg-scanpackages
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 zstd

      - name: Generate Packages and Metadata
        run: |
          dpkg-scanpackages -m ./debs /dev/null > ./Packages
          
          # Remove all firmware version constraints so tweaks show on any iOS version
          sed -i 's/, firmware ([^)]*)[,]*/,/g' ./Packages
          sed -i 's/^Depends: ,/Depends: /' ./Packages
          sed -i 's/, mobilesubstrate/mobilesubstrate/g' ./Packages
          
          # Remove "+debug" from all versions (fixes legacy dpkg parsing bugs)
          sed -i 's/+debug//g' ./Packages
          
          bzip2 -k -f ./Packages
          gzip -k -f ./Packages
          zstd -k -f ./Packages -o ./Packages.zst

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Packages.zst
          git commit -m "Automated repo update: remove firmware constraints for universal compatibility" || exit 0
          git push
